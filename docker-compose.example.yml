services:
  janus-deck:
    image: ghcr.io/your-github-username/janus-deck:latest
    # Or build locally:
    # build: .
    container_name: janus-deck
    restart: unless-stopped
    pid: host # Required for bare-metal process and hardware telemetry

    # Required for host DBus system bus access on Ubuntu/Debian (bypasses docker-default AppArmor)
    security_opt:
      - apparmor:unconfined

    ports:
      - "8080:8080"

    environment:
      - TZ=UTC
      - JANUS_CONFIG=/app/config.yaml
      # - DATABASE_URL=postgresql+asyncpg://janusdeck:password@o4nipot4qcoaskqwss3zf6bq:5432/janusdeck
      # - JANUS_PIN=2070 # Optional: uncomment only if you want to override the PIN in config.yaml

    networks:
      - default

    volumes:
      # Application Configuration
      - ./config.yaml:/app/config.yaml:ro

      # Host systemctl & power management via DBus
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro

      # Access to GRUB environment for one-shot OS switching (grub-reboot)
      - /boot:/boot:rw

      # Storage telemetry: Mount host storage pools read-only to monitor disk usage
      - /data/storage:/data/storage:ro

      # Automated backup repository: Read-only access to inspect snapshot archives
      - /data/backups:/data/backups:ro

    # NVIDIA GPU Telemetry Passthrough (Optional - remove if no NVIDIA GPU)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  default:
    name: coolify
    external: true
