services:
  janus-deck:
    build:
      context: .
      dockerfile: Dockerfile
    image: janus-deck:local
    container_name: janus-deck
    restart: unless-stopped
    pid: host # Host PID namespace for bare-metal process and hardware telemetry

    ports:
      - "${JANUS_HOST_PORT:-8085}:8080"

    environment:
      - TZ=UTC
      - JANUS_CONFIG=/app/config.yaml
      - JANUS_PIN=2070 # Override master PIN via environment variable

    volumes:
      # Application Configuration (Copy config.example.yaml to config.yaml before starting)
      - ./config.yaml:/app/config.yaml:ro

      # Host systemctl & power management via DBus socket
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro

      # Host GRUB environment for one-shot OS switching (grub-reboot)
      - /boot:/boot:rw

    # NVIDIA GPU Telemetry Passthrough
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Traefik Reverse Proxy & VPN/LAN Restriction
    labels:
      - "traefik.enable=true"
      # Only allow traffic from local LAN, WireGuard VPN subnet, and localhost
      - "traefik.http.middlewares.vpn-only.ipallowlist.sourcerange=192.168.1.0/24, 10.8.0.0/24, 127.0.0.1/32"
      - "traefik.http.middlewares.vpn-only.ipwhitelist.sourcerange=192.168.1.0/24, 10.8.0.0/24, 127.0.0.1/32"
      - "traefik.http.routers.janus-deck.middlewares=vpn-only"
