services:
  janus-deck:
    build:
      context: .
      dockerfile: Dockerfile
    image: janus-deck:local
    container_name: janus-deck
    restart: unless-stopped
    pid: host # Host PID namespace for bare-metal process and hardware telemetry

    # Required for host DBus system bus access on Ubuntu/Debian (bypasses docker-default AppArmor)
    security_opt:
      - apparmor:unconfined

    ports:
      - "${JANUS_HOST_PORT:-8085}:8080"

    environment:
      - TZ=UTC
      - JANUS_CONFIG=/app/config.yaml
      - DATABASE_URL=postgresql+asyncpg://janus:JanusDeckSecure2026!@o4nipot4qcoaskqwss3zf6bq:5432/janusdeck
      # - JANUS_PIN=2070 # Optional: uncomment only if you want to override the PIN in config.yaml

    networks:
      - default

    volumes:
      # Application Configuration (Copy config.example.yaml to config.yaml before starting)
      - ./config.yaml:/app/config.yaml:ro

      # Host systemctl & power management via DBus socket
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro

      # Host GRUB environment for one-shot OS switching (grub-reboot)
      - /boot:/boot:rw

      # Storage telemetry: Mount host storage pools read-only to monitor disk usage
      - /data/storage:/data/storage:ro

    # NVIDIA GPU Telemetry Passthrough
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  default:
    name: coolify
    external: true
